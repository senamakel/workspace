# Router configuration.
#
# Credentials are named by environment variable, never inlined, so this file is
# safe to commit. Copy it to `config.toml` and adjust.

[server]
bind = "0.0.0.0:6969"
# A single upstream attempt that outlives this is treated as a rung failure and
# the ladder advances.
request_timeout = "120s"
# The key callers must present, as `Authorization: Bearer <key>` or `x-api-key`.
# Both spellings work on both surfaces.
#
# Named, never inlined. This file is committed and copied between machines, so
# a literal key here is a key in git history and in every copy — and the one
# that used to sit on this line was a real deployment's key. `server.api_key`
# still exists for a throwaway loopback run, but nothing that ships should use
# it.
#
# With the variable unset the router accepts *every* caller, which is only ever
# appropriate on a loopback bind — and the bind above is not loopback. Set
# `LADDER_API_KEY` in the environment before starting this.
api_key_env = "LADDER_API_KEY"

[pricing]
# How often the order books are re-read.
refresh = "15m"
# Price data older than this is not trusted; a capped rung whose prices are
# stale is skipped rather than admitted on a guess.
stale_after = "1h"

# Prompt caches are warm only where the prefix was already seen, so a
# conversation is pinned to the rung and sub-provider that served it and stays
# there while that choice still fits the budget. A changed ceiling or a rung the
# market can no longer satisfy drops the pin; it never overrides a ceiling.
[sessions]
enabled = true
# Idle timeout. Every request refreshes the pin, so this expires abandoned
# conversations rather than active ones.
ttl = "30m"
max_entries = 10000
# Callers can also identify a thread with OpenAI's `user` field or Anthropic's
# `metadata.user_id`, so an unmodified client still gets sticky routing.
header = "x-ladder-session"

[credits]
refresh = "5m"
# A provider with less than this much spendable balance is skipped entirely.
min_balance_usd = 0.50

# A 429 is the upstream refusing for a while, not failing. The rung that met one
# is parked and skipped until it lifts, so a throttled provider costs one wasted
# round trip rather than one per request. A `Retry-After` wins over the default
# below and is clamped to `max_cooldown`, because a header asking for an hour
# would otherwise empty a ladder on one busy minute.
[rate_limits]
cooldown = "30s"
max_cooldown = "5m"

# Each marketplace resells many sub-providers whose prices move independently,
# so each carries its own ceiling that holds no matter which ladder or rung got
# there. A rung's own ceiling combines with this one by taking the tighter.
#
# These sit at the `max-reasoning` ladder's ceiling rather than the cheap
# ladders': the tighter of the two wins, so a provider ceiling of 0.50 would
# silently clamp that ladder's 1.00 rungs back to 0.50 and the depth it pays for
# would never be bought. Every rung below still carries its own, stricter
# ceiling, which is what actually binds on the cheap ladders — this one is the
# backstop against a marketplace-wide price move, not the day-to-day limit.

[providers.surplus]
kind = "surplus"
base_url = "https://api.surplusintelligence.ai"
api_key_env = "SURPLUS_API_KEY"
max_cost_per_1m = 1.00

# Mistral's own API, reached directly rather than through a reseller. One seller
# means no order book, no balance endpoint, and nothing for a ceiling to bind
# against — a rung here is a choice of model, and a ceiling on one is refused at
# load time. It is for models no marketplace carries.
[providers.mistral]
kind = "mistral"
base_url = "https://api.mistral.ai"
api_key_env = "MISTRAL_API_KEY"

# Venice's own API, direct for the same reasons Mistral is, and here for a
# different one. The model is the uncensored one, and whether any given
# marketplace is reselling it this week is that marketplace's policy decision,
# not a fact the router can rely on. A rung at the house that publishes it is
# the floor under a tier that would otherwise vanish when a reseller changes its
# mind. As with any direct provider, a ceiling on it is refused at load time.
#
# Venice prepends a system prompt of its own unless asked not to; the router
# asks not to on every request, since a tier that chose this model and silently
# got that framing is not the tier that was chosen. A caller who sends their own
# `venice_parameters` stays in charge of theirs.
[providers.venice]
kind = "venice"
base_url = "https://api.venice.ai"
api_key_env = "VENICE_INFERENCE_KEY"

[providers.openrouter]
kind = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# 2.50 rather than 1.00. The cheapest `deepseek-v4-pro` endpoint here lists at
# 1.20/1M completion — measured 2026-09-09, and the next three are 1.74, 1.91
# and 1.91 — so a 1.00 backstop admitted no seller at all and skipped every
# reasoning rung on this provider. Invisible while Surplus was healthy, because
# the ladder never reached the rung; the moment Surplus went down both deep
# ladders came back `ladder exhausted` instead of failing over. A fallback that
# is silently ineligible is not a fallback. Still well under the 3.30 direct
# rate this ceiling exists to refuse.
max_cost_per_1m = 2.50
headers = { "HTTP-Referer" = "https://opencompany.tinyhumans.ai/", "X-OpenRouter-Title" = "OpenCompany" }

# Prices observed live on 2026-09-09, USD per million output tokens, counting
# only sellers the marketplace reports as available and healthy:
#
#   model                        direct    best   median   admitted under the
#                                                          ceiling below
#   surplus deepseek-v4-pro      1.9105  0.0222   0.5655    93 of 242 @ 0.30
#   surplus glm-5.3              4.4000  0.0440   1.1000    16 of 136 @ 0.40
#   surplus glm-5.2              3.0360  0.0494   0.9350    23 of 154 @ 0.30
#   surplus minimax-m2.7         1.2000  0.0344   0.4824    20 of  87 @ 0.30
#   surplus gpt-5.6-terra       12.0000  0.2436   4.1706    21 of 105 @ 1.00
#   surplus gpt-5.6-luna         1.2000  0.0134   0.3600    51 of 107 @ 0.30
#   surplus minimax-m2.5         0.9500  0.0095   0.2375   103 of 171 @ 0.25
#   surplus glm-5.3-flash        0.2500  0.0198   0.0633    62 of  78 @ 0.15
#   surplus deepseek-v4-flash    0.1772  0.0142   0.0798   130 of 154 @ 0.15
#   openrouter deepseek-v4-flash      —  0.1372   0.2800    18 @ 0.30
#
# The direct rates moved a long way since the 2026-08-18 table this replaces —
# `deepseek-v4-pro` fell 3.30 to 1.91, `gpt-5.6-luna` rose 0.60 to 1.20 — and a
# ceiling is restated as a discount off the direct price before dispatch, so a
# stale table is a stale filter. Re-read the order books before editing a
# ceiling here; every count above is what the ceiling beside it admits today.
#
# The rule the numbers are chosen by: a ceiling admits at least a couple of
# dozen live sellers, so one seller going down is a step in price rather than
# an empty rung. Ceilings on `flash` and `reasoning` still sit at or under
# their model's median, which is what makes them a discount rather than the
# going rate.
#
# `max-reasoning` is the deliberate exception: at 1.00 it sits above the median
# for `deepseek-v4-pro` (0.57) and near it for `glm-5.3`, so it admits a
# typical seller rather than waiting for a discount — and still far under the
# 1.91 and 4.40 direct rates. That is the trade it exists to make: a caller on
# this ladder would rather pay the going rate than step down to a shallower
# model.

# Rungs are ranked, not stepped: each one's cheapest admitted seller is divided
# by its `score_multiplier` and the lowest result serves. A multiplier is "how
# many times the baseline model's price this one is still worth paying", so 1.0
# is the baseline and rung order survives only as the tie-break.
#
# The same model carries a different multiplier on different ladders, which is
# the point: what depth is worth is a property of the job, not of the model.

# 2026-08-18: every ladder below now ends in an OpenRouter rung, and that is
# the lesson of an outage rather than a price argument. Surplus spent roughly
# fifteen minutes answering `403 Forbidden` as HTML from its own edge —
# reproduced with a direct `curl`, so neither this router nor the key — and
# five live runs died inside the same minute. Two things had to change for a
# provider outage to be a step down instead of an ending: the failover loop
# now advances on a retryable HTTP status and not only on a transport error,
# and every ladder carries a rung on a second provider for it to advance to.
# A ladder whose rungs share one provider has no failover, whatever its length.

# `aliases` is how one ladder answers to every name its callers use. A client
# names a model, and the names disagree: the same cheap ladder is `flash` here,
# `chat-v1` to one harness, and `flash[1m]` once an ACP layer has appended the
# context-variant marker. The router resolves an exact name first, then an
# exact alias, then either with a trailing `[...]` marker stripped, then either
# folded to lowercase — so the marker needs no alias at all, and a mirrored
# copy of a ladder under a second name is never the answer. The copies were:
# they drifted from the originals, and a name nobody remembered to copy came
# back to the caller as `unknown ladder`.

# The cheap, high-throughput ladder. The multipliers are close together because
# on this ladder they nearly are: any of these will do, so price decides.
[[ladders]]
name = "flash"
aliases = ["chat-v1", "vision-v1", "flash-v1"]
cost_basis = "completion"

  # 2026-09-11: OpenRouter rungs moved to the FRONT of this ladder and the
  # fallback moved off Surplus. The Surplus deepseek-v4-flash rung killed a run
  # of PR babysitters twice in one afternoon - first with the thinking-mode
  # "reasoning_content must be passed back" 400 (now advanced past, PR #16),
  # then with a hard 204800-token context ceiling that Claude Code's compaction
  # does not anticipate. Every one of those callers is a long agentic session
  # where one refused turn discards an hour of work, so for now the dependable
  # seller goes first and Surplus is the discount to fall through TO, not FROM.
  # Revert this ordering once Surplus's deepseek-v4-flash endpoint is stable.
  [[ladders.rungs]]
  provider = "openrouter"
  model = "deepseek/deepseek-v4-flash"
  score_multiplier = 1.0
  max_cost_per_1m = 0.30
  prefer = ["deepinfra"]

  # Same host as rung 0 on purpose: a fallback that lands on a different
  # sub-provider starts from a cold prompt cache, and with ~70k tokens of
  # stable prefix per request that re-warm costs more than the rung saves.
  # Measured 2026-09-11: 13% of requests fell to this rung and the session
  # cache-hit rate sat at 56%.
  [[ladders.rungs]]
  provider = "openrouter"
  model = "deepseek/deepseek-v4-flash"
  score_multiplier = 1.0
  max_cost_per_1m = 0.40
  prefer = ["deepinfra"]

  # The Surplus rungs are parked, not deleted. Selection is by score, not by
  # listing order (README "Scoring"), and Surplus's deepseek-v4-flash clears at
  # ~0.012/1M against OpenRouter's ~0.09 - so while these are live they win every
  # request and the ordering above changes nothing. Uncomment to restore the
  # discount once the endpoint is trustworthy again.
  #
  # [[ladders.rungs]]
  # provider = "surplus"
  # model = "gpt-5.6-luna"
  # score_multiplier = 1.2
  # max_cost_per_1m = 0.30
  #
  # [[ladders.rungs]]
  # provider = "surplus"
  # model = "deepseek-v4-flash"
  # score_multiplier = 1.0
  # max_cost_per_1m = 0.15

  [ladders.fallback]
  provider = "openrouter"
  model = "deepseek/deepseek-v4-flash"

[[ladders]]
name = "reasoning"
aliases = ["deepseek"]
cost_basis = "completion"

  # 2026-09-11: parked on OpenRouter, like `flash`. Every surplus rung here
  # (deepseek-v4-pro, glm-5.x, minimax, luna, deepseek-v4-flash) was cutting
  # streamed responses mid-sentence for the pr-babysitter passes, and the
  # cheapest-per-1m scorer kept picking the surplus flash rung over anything
  # else. The surplus rungs are in git history; restore them once surplus
  # streaming is trustworthy again.
  [[ladders.rungs]]
  provider = "openrouter"
  model = "deepseek/deepseek-v4-pro"
  score_multiplier = 2.0
  max_cost_per_1m = 2.00

  [ladders.fallback]
  provider = "openrouter"
  model = "deepseek/deepseek-v4-pro"

[[ladders]]
name = "max-reasoning"
aliases = ["max-reasoning-v1"]
cost_basis = "completion"
# The fallback, so a rung added in a hurry still asks for depth. Every rung
# below names its own anyway: which words a model accepts is a fact about that
# model, and reading it off the rung beats inferring it from a default two
# screens up.
reasoning_effort = "high"

  # There is deliberately no `gpt-5.6-terra` rung here, though its order book
  # looks like there should be: 105 healthy sellers and a cheapest offer at
  # 0.244 against a 12.00 direct rate. A 1.00 ceiling restates as 91% off, and
  # Surplus refuses that outright — measured live, min85 refused and min80
  # served. Buying it needs a ceiling of 2.40, which is above this ladder's
  # budget and above the provider backstop besides. A rung that can never
  # dispatch is worse than no rung: it wins selection on its multiplier and
  # then fails, costing a round trip per request. It goes back in if the
  # discounts on it deepen.

  [[ladders.rungs]]
  provider = "surplus"
  model = "deepseek-v4-pro"
  score_multiplier = 8.0
  reasoning_effort = "high"
  max_cost_per_1m = 1.00

  [[ladders.rungs]]
  provider = "surplus"
  model = "glm-5.3"
  score_multiplier = 6.5
  reasoning_effort = "high"
  max_cost_per_1m = 1.00

  [[ladders.rungs]]
  provider = "surplus"
  model = "glm-5.2"
  score_multiplier = 6.0
  reasoning_effort = "high"
  max_cost_per_1m = 1.00

  [[ladders.rungs]]
  provider = "surplus"
  model = "gpt-5.6-luna"
  score_multiplier = 1.5
  # The one rung whose model family takes a setting above `high`.
  reasoning_effort = "xhigh"
  max_cost_per_1m = 0.60

  [[ladders.rungs]]
  provider = "openrouter"
  model = "deepseek/deepseek-v4-pro"
  score_multiplier = 8.0
  reasoning_effort = "high"
  max_cost_per_1m = 2.00


  # The last resort, reached only once every rung above has failed or been
  # priced out. Uncapped on purpose — it carries no ceiling and dispatches with
  # no marketplace price filter — because the thing it is weighed against is
  # not a cheaper rung, it is a 502.
  #
  # The model is chosen so that being uncapped is a bounded promise rather than
  # a blank cheque: the worst this can cost is deepseek-v4-pro's direct rate of $1.91/1M, which
  # is the price of never seeing `ladder exhausted` on this ladder again.
  [ladders.fallback]
  provider = "surplus"
  model = "deepseek-v4-pro"


# The OpenCompany tier ladder: deepseek-v4-flash, primary and only.
#
# Added 2026-09-10 to run the conjecture-solver against Kourovka 20.76 on one
# cheap model. It is a deliberate override of the tier routing, not a new
# capability band, and it is removable by deleting this block and putting
# `reasoning-v1` and `agentic-v1` back on the two ladders they came from.
#
# # Why an extra ladder rather than a reordered rung
#
# "deepseek-v4-flash primary" could have been spelled by raising that model's
# `score_multiplier` on `reasoning` and `max-reasoning` until it outranked
# everything above it. That was rejected twice over. Ranking here is
# price-divided-by-multiplier, so making a rung win *robustly* against a rival
# whose price can move needs a multiplier set from the rival's floor rather
# than its current price — roughly 13x on this board — and a number chosen that
# way stops meaning what `score_multiplier` is documented to mean two hundred
# lines above. And both of those ladders are machine-wide: CortexDB's answer
# and verifier roles ask for `reasoning` by name, and demoting it to a flash
# model would quietly change what every other consumer on this box is buying.
#
# The tier names are the narrower handle. `reasoning-v1` and `agentic-v1` are
# OpenCompany's own vocabulary — `build.rs` maps an agent's `tier = "reasoning"`
# to the first and `tier = "orchestrator"` to the second — so moving those two
# aliases here redirects exactly the callers this run is about and nothing else.
# `flash`, `reasoning`, `max-reasoning`, `scribe` and `vectors` still mean today
# what they meant yesterday to everything that asks for them by name.
#
# `deepseek` and `max-reasoning-v1` stay on their original ladders on purpose:
# they are how a caller asks for the deep ladders explicitly, and an explicit
# request should still get what it asked for while this override is in place.
#
# # Why every rung is the same model
#
# Because that is the request. This ladder has no quality trade to make and no
# multiplier worth tuning — the rungs differ only in where the model is bought,
# which is what keeps a provider outage a step down rather than an ending. The
# ordering follows the file's own rule: Surplus first because it is priced
# lowest under a ceiling set just under OpenRouter's cheapest endpoint, then
# OpenRouter with a preferred seller, then OpenRouter with none, then an
# uncapped fallback whose worst case is deepseek-v4-flash's 0.18/1M direct rate.
[[ladders]]
name = "deepseek-flash"
aliases = ["reasoning-v1", "agentic-v1"]
cost_basis = "completion"

  [[ladders.rungs]]
  provider = "surplus"
  model = "deepseek-v4-flash"
  score_multiplier = 1.0
  max_cost_per_1m = 0.15

  [[ladders.rungs]]
  provider = "openrouter"
  model = "deepseek/deepseek-v4-flash"
  score_multiplier = 1.0
  max_cost_per_1m = 0.30
  prefer = ["deepinfra"]

  # The same model with no preferred seller. With `prefer` naming the only live
  # seller, that endpoint going briefly unavailable emptied the `flash` ladder
  # outright; this rung is why it cannot happen here.
  [[ladders.rungs]]
  provider = "openrouter"
  model = "deepseek/deepseek-v4-flash"
  score_multiplier = 1.0
  max_cost_per_1m = 0.40

  [ladders.fallback]
  provider = "surplus"
  model = "deepseek-v4-flash"


# The scribe ladder: one rung, one seller, one model.
#
# Leanstral is a Lean 4 proof-engineering model that no marketplace resells, so
# it is reached at Mistral directly. There is nothing to rank and nothing to
# step down to — a ladder of one is how this router says "this model or
# nothing", which for a role whose output is checked by a kernel is the right
# answer. A ceiling here would be refused at load time.
[[ladders]]
name = "scribe"

  [[ladders.rungs]]
  provider = "mistral"
  model = "labs-leanstral-1-5"

  # This rung is attempted only after the normal one cannot serve. It is
  # intentionally uncapped, so it may exceed the normal ladder budget.
  [ladders.fallback]
  provider = "surplus"
  model = "deepseek-v4-flash"


# The uncensored ladder: one model, reached two ways.
#
# Both rungs are the same model, so there is no quality trade here and no
# multiplier worth tuning — only where it is bought. Surplus goes first because
# it is the one of the two that can be cheap: it is priced, so it is ranked, and
# a priced rung always outranks an unpriced one. Venice is the house that
# publishes the model and prices it at one rate, which is exactly why it belongs
# second — it cannot be outbid, it can only be fallen back to.
#
# That ordering is not the ladder file's doing. An unpriced rung has nothing to
# divide by its multiplier, so the engine ranks it behind every rung it could
# measure; the direct rung is reached when Surplus has no seller under the
# ceiling, has gone stale, is rate-limited, or has stopped carrying the model at
# all. Which is the failure this ladder exists to survive.
[[ladders]]
name = "uncensored"
cost_basis = "completion"

  [[ladders.rungs]]
  provider = "surplus"
  model = "venice-uncensored-1.2"
  score_multiplier = 1.0
  # A resold seat on this model is worth taking at a discount and not worth
  # taking at the going rate, because the going rate is what the second rung
  # charges anyway.
  max_cost_per_1m = 0.30

  [[ladders.rungs]]
  provider = "venice"
  # Venice's own spelling of the same model. A rung names a model in its
  # provider's convention, and these two conventions genuinely differ — the
  # marketplace writes the version with a dot, the house with a hyphen.
  model = "venice-uncensored-1-2"


# The embeddings ladder.
#
# A different surface, not a different price band: an embedding model cannot
# answer a chat request, so the ladder says which endpoint it serves and the
# router refuses the wrong pairing at the door rather than sending prose to a
# vector endpoint. Everything else is the machinery above — the rung is ranked,
# a failure advances, a 429 parks it.
#
# No ceiling, and one would be refused at load time. Neither marketplace
# publishes a price filter for embeddings: Surplus's `/min{N}/` prefix 404s on
# `/v1/embeddings` in every spelling, and OpenRouter lists no embedding model at
# all. The 1.00 ceiling on `providers.surplus` above is therefore not inherited
# here, which is deliberate rather than an oversight.
#
# Surplus is the only one of the three carrying an embedding model today:
# venice-embed-1, direct price 0.02/1M, with sellers observed from 0.001. A
# ladder of one, for the same reason `scribe` is one.
[[ladders]]
name = "vectors"
aliases = ["embeddings-v1", "vectors-v1"]
surface = "embeddings"

  # Two rungs, and they return the SAME WIDTH on purpose.
  #
  # An embeddings ladder is not a chat ladder. A chat caller that fails over to
  # another rung gets a different answer; an embeddings caller that fails over
  # to a rung of a different width gets vectors that cannot be compared with
  # the ones already in the index — and a store like CortexDB pins its width on
  # first ingest and rejects every other width forever after. Failover here is
  # therefore only safe between models of equal dimensionality, and both of
  # these are 1024. A rung of another width does not belong in this ladder; it
  # belongs in a second ladder with its own name.
  #
  # Surplus's `venice-embed-1` was the only rung and is removed, not demoted:
  # the marketplace still LISTS it in /v1/models and rejects it at request time
  # with "Model venice-embed-1 does not exist" — verified against the
  # marketplace directly, not through this router. A rung that is advertised and
  # unbuyable is worse than an absent one, because the ladder looks healthy
  # while every embedding call fails. Downstream that read as
  # "embedding missing for chunk; vector index will not contain this memory",
  # which cost CortexDB its vector index entirely on both boxes that use it.

  # BGE-M3 through Venice's own API: a strong multilingual retrieval model,
  # reached from the house rather than a reseller, so there is no order book to
  # go stale underneath it, and it accepts the `dimensions` field that
  # OpenAI-compatible embedding clients send. Needs VENICE_INFERENCE_KEY
  # exported on the box; the router skips the provider with a warning where that
  # is unset, and this ladder then has no rung at all.
  [[ladders.rungs]]
  provider = "venice"
  model = "text-embedding-bge-m3"

  # A ladder of one, like `scribe`, and NOT for want of a candidate.
  #
  # `mistral-embed` is the obvious second rung: same 1024 width, a key already
  # on every box. It is absent because it cannot serve this ladder's actual
  # caller. An OpenAI-compatible embeddings client sends `dimensions` in the
  # body — CortexDB does — and Mistral answers 422:
  #
  #   {"type":"extra_forbidden","loc":["body","EmbeddingRequest","dimensions"]}
  #
  # So a failover to it would turn a Venice outage into a hard failure with a
  # confusing error, rather than the degraded service a fallback is for. A rung
  # that 422s the request the ladder exists to serve is not redundancy. Add it
  # back if the router ever strips `dimensions` per provider.
